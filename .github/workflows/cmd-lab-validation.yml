name: Validate CMD learning kit on Windows

on:
  push:
    branches: [docs/cmd-guide-downloads]
    paths:
      - 'docs/cmd/practice/**'
      - 'docs/cmd/validation/**'
      - '.github/workflows/cmd-lab-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cmd-learning-kit:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: Check out the learning kit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check CMD scripts and their lab guards
        shell: powershell
        run: |
          & .\docs\cmd\validation\verify-kit.ps1 -KitSource .\docs\cmd\practice -OutputReport "$env:RUNNER_TEMP\cmd-kit-results.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish the test result
        if: always()
        shell: powershell
        run: |
          $reportPath = Join-Path $env:RUNNER_TEMP 'cmd-kit-results.json'
          if (Test-Path -LiteralPath $reportPath) {
            $report = Get-Content -LiteralPath $reportPath -Raw | ConvertFrom-Json
            "CMD kit checks: $($report.checkCount); passed: $($report.passed)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8
            $report.checks | ForEach-Object { "- PASS: $_" } | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            if (!$report.passed) {
              $message = $report.error -replace '%','%25' -replace "`r",'%0D' -replace "`n",'%0A'
              Write-Host "::error title=CMD learning kit::$message"
              if ($report.runs.Count -gt 0) {
                $lastRun = $report.runs[-1]
                $details = "Exit code $($lastRun.exitCode): $($lastRun.output)"
                $details = $details -replace '%','%25' -replace "`r",'%0D' -replace "`n",'%0A'
                Write-Host "::error title=CMD runtime output::$details"
              }
            }
          } else {
            Write-Host '::error title=CMD learning kit::Test result was not created.'
          }
